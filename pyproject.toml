[project]
name = "lockesmith"
version = "0.1.0"
description = "Deep research agent that tells Pokémon Emerald players what to catch next, and where, to beat the rest of the game."
authors = [{ name = "Colettak16", email = "kc3936@columbia.edu" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "langfuse>=5.1.0",
    "openai-agents[litellm]>=0.24.0",
    "openinference-instrumentation-openai-agents>=2.7.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

    notes: "Double battle against just two Pokémon, Lunatone 42 and Solrock 42, holding nothing (Emerald adds Claydol and Xatu and gives both Sitrus Berries). Super Rod: Mossdeep fisherman (MossdeepCity_House3). The eastern sea opens by Surf once the Wailmer leave (E-05), as in Emerald; Routes 132-134's currents run west only. There's no Space Center battle after this gym in Ruby/Sapphire. Pacifidlog's trade gives Corsola for your Bellossom. Mirage Island appears only on days when the daily value matches a party Pokémon's personality value."
    source: "guide:Walkthrough:Pokemon_Ruby_and_Sapphire/Part_15#Mossdeep_Gym"


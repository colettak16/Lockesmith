    notes: {ruby: "A required wild battle, not in Emerald: Sootopolis's doors (gym included) stay shut until FLAG_LEGENDARY_BATTLE_COMPLETED, which is set however it ends (caught, knocked out or fled), and Wallace then goes to his gym. It's the only chance at Groudon: the trigger is disabled afterwards. The Expert at the entrance steps aside after the Seafloor Cavern (E-07). HM07 Waterfall is an item ball on B3F on the way (usable only with the Rain Badge). For challenge runs, report three things rather than pick a rule: the battle is required but catching isn't; B4F is the same location (cave-of-origin) as the wild floors 1F-B3F (Zubat, Golbat, Mawile), so under a strict first-encounter-per-location rule an earlier wild encounter there uses it up unless statics are counted separately; and at Lv45 it's above Wallace's ace (Milotic 43), so under a next-leader level cap it can't be used against Wallace.", sapphire: "A required wild battle, not in Emerald: Sootopolis's doors (gym included) stay shut until FLAG_LEGENDARY_BATTLE_COMPLETED, which is set however it ends (caught, knocked out or fled), and Wallace then goes to his gym. It's the only chance at Kyogre: the trigger is disabled afterwards. The Expert at the entrance steps aside after the Seafloor Cavern (E-07). HM07 Waterfall is an item ball on B3F on the way (usable only with the Rain Badge). For challenge runs, report three things rather than pick a rule: the battle is required but catching isn't; B4F is the same location (cave-of-origin) as the wild floors 1F-B3F (Zubat, Golbat, Sableye), so under a strict first-encounter-per-location rule an earlier wild encounter there uses it up unless statics are counted separately; and at Lv45 it's above Wallace's ace (Milotic 43), so under a next-leader level cap it can't be used against Wallace."}
    source: {ruby: "guide:Walkthrough:Pokemon_Ruby_and_Sapphire/Part_17#VS_Groudon_(Ruby)", sapphire: "guide:Walkthrough:Pokemon_Ruby_and_Sapphire/Part_17#VS_Kyogre_(Sapphire)"}


# Story milestones that aren't battles but gate areas or encounters (review packet E-01..E-09).
# `after` is the battle the event can first happen after; `opens` / `closes` say what changes.
events:
  - {id: meteor_falls_scene, after: gym3_wattson, flag: FLAG_HIDE_GRUNTS_BLOCKING_CABLE_CAR, opens: "Route 112's cable car to Mt. Chimney (the two grunts blocking it leave)", source: "decomp:data/maps/MeteorFalls_1F_1R/scripts.inc"}
  - {id: museum_cleared, after: grunts_oceanic_museum, flag: FLAG_HIDE_EVIL_TEAM_ROUTE110, opens: "Route 110 north of the grunt line", source: "decomp:data/maps/SlateportCity_OceanicMuseum_2F/scripts.inc"}
  - {id: mt_pyre_orb_stolen, after: rival3_route119, flag: FLAG_MT_PYRE_ORB_STOLEN, opens: "the Slateport Harbor scene (VAR_SLATEPORT_HARBOR_STATE = 1); no badge check, fires on reaching the summit", source: "decomp:data/maps/MtPyre_Summit/scripts.inc"}
  - {id: slateport_submarine_theft, after: rival3_route119, flag: FLAG_HIDE_GRUNT_1_BLOCKING_HIDEOUT, opens: "Lilycove's hideout (the grunts blocking its entrance leave); needs mt_pyre_orb_stolen, then entering Slateport Harbor", source: "decomp:data/maps/SlateportCity_Harbor/scripts.inc"}
  - {id: hideout_cleared, after: admin_hideout, flag: FLAG_EVIL_TEAM_ESCAPED_IN_SUBMARINE, opens: "the sea east of Lilycove (the Wailmer leave)", source: "decomp:data/maps/AquaHideout_B2F/scripts.inc"}
  - {id: hideout_closed, after: gym7_tate_liza, flag: FLAG_BADGE07_GET, closes: "Lilycove's hideout for good: its two Electrode, the Master Ball, Max Elixir, Nugget and Nest Ball are missable", source: "decomp:data/maps/LilycoveCity/scripts.inc"}
  - {id: legend_escaped, after: leader_seafloor_cavern, flag: FLAG_LEGEND_ESCAPED_SEAFLOOR_CAVERN, opens: "Cave of Origin (the Expert at its entrance steps aside)", source: "decomp:data/maps/SootopolisCity/scripts.inc"}
  - {id: legendary_battle_done, after: legendary_cave_of_origin, flag: FLAG_LEGENDARY_BATTLE_COMPLETED, opens: "Sootopolis's doors and gym; Wallace appears", source: "decomp:data/maps/CaveOfOrigin_B4F/scripts.inc"}
  - {id: hall_of_fame, after: champion_steven, flag: FLAG_SYS_GAME_CLEAR, opens: "Sky Pillar (Rayquaza), the Beldum gift, the S.S. Tidal, and the TV news at home that starts the roamer (FLAG_SYS_TV_LATI, set only while no Lati is roaming yet)", source: "decomp:data/scripts/hall_of_fame.inc"}
  - {id: lati_tv_report, after: champion_steven, flag: FLAG_LATIOS_OR_LATIAS_ROAMING, opens: "the roaming Latios (Ruby) / Latias (Sapphire): after the Hall of Fame the TV on your house's 1F shows the news, and checking it runs InitRoamer. Nothing starts it automatically, and there's no color question (Emerald asks which one; here the version decides)", source: "decomp:data/scripts/tv.inc"}

# Areas that close for good. With `after`, the area is still reachable before that battle and
# gone for every later one, so the tools stop offering it; without `after`, it closes on a
# player action and the tools only flag it as missable.
closes:
  - {area: {ruby: team-magma-hideout, sapphire: team-aqua-hideout}, after: gym7_tate_liza, reason: "Lilycove's hideout is walled off for good once you hold the Mind Badge (LilycoveCity_OnLoad checks FLAG_BADGE07_GET; E-06), taking its two Lv30 Electrode and its items (the Master Ball among them) with it"}
  - {area: cave-of-origin/b4f, methods: [static], after: legendary_cave_of_origin, reason: "the Lv45 legendary is the required battle itself; once it ends (caught, knocked out or fled) it's gone"}

# Encounters that can't be had before the Champion (see data/progression.yaml).
never_reachable:
  - {area: mossdeep-city/stevens-house, methods: [gift], reason: "you visit Steven's house for HM08 Dive before the Champion; only the Beldum gift comes after the Hall of Fame (hall_of_fame.inc)"}
  - {area: sky-pillar, reason: "postgame in Ruby/Sapphire: Route 131 opens the way only after the Hall of Fame (Route131_MapScripts)"}
  - {area: roaming-hoenn, reason: "the roaming Latios (Ruby) / Latias (Sapphire) starts after the Hall of Fame, once you check the TV news at home (E-10)"}
  - {area: southern-island, reason: "Eon Ticket event"}
  - {area: hoenn-pokecenter, reason: "Colosseum bonus disc gift (event)"}

# LockeSmith progression file for Pokémon Ruby and Sapphire (docs/review_packet_rs.md, section 4)
#
# The ordered story steps from the first rival fight to the Champion, shared by both
# versions. A value written as {ruby: ..., sapphire: ...} is resolved for the version
# being loaded (agent/progression.py): Ruby's story fights Team Magma, Sapphire's Team
# Aqua, and the hideout and the Cave of Origin legendary differ.
#
# How it was drafted
#   - Battles and trainer constants: every trainerbattle in pokeruby's map scripts that
#     names a leader, Elite Four member, champion, rival or Wally, plus the villain fights
#     through constants/version.inc's aliases, resolved per version. The forced
#     Groudon/Kyogre battle is a step of its own (`wild`).
#   - Order and areas: Emerald's reviewed data/progression.yaml, whose map connections and
#     warps match Ruby/Sapphire on all 348 shared maps, with the Ruby/Sapphire changes the
#     review packet lists (A-01 to A-10) and two review rounds applied. Event gates that
#     could differ were checked in pokeruby's scripts; see `events` at the end.
#   - Same rules as Emerald's file: an area is listed at the first battle it can be
#     reached before, having fought only the battles above it; an HM counts once you hold
#     it and the badge that allows it outside battle (pokemon_menu.c checks
#     FLAG_BADGE01_GET + the field move's index: Cut 1, Flash 2, Rock Smash 3, Strength 4,
#     Surf 5, Fly 6, Dive 7, Waterfall 8). Badge order is looser than this list: only
#     Norman's gym checks earlier badges (VAR_PETALBURG_GYM_STATE), after the first four
#     in any order.
#
# Fields: as in data/progression.yaml, plus
#   wild    a required wild battle: {species, level}; trainer_consts is then []
#   events  (top level) story milestones that aren't battles but open or close areas
#
# Rival constants: the rival takes the starter with the type advantage over yours. In
# pokeruby the Route 103/110/119 constants are numbered (MAY_4 = Torchic for a Treecko
# player, ...); the Lilycove ones are named after the player's starter. May's and
# Brendan's teams are the same except the Route 110 lead for Mudkip players.

version: 1

battles:

    order: 1
    label: "Route 103: Rival (first battle)"
    badges_before: 0
    trainer_consts: null
    starter_variants:
      treecko: {may: TRAINER_MAY_4, brendan: TRAINER_BRENDAN_4}
      torchic: {may: TRAINER_MAY_7, brendan: TRAINER_BRENDAN_7}
      mudkip: {may: TRAINER_MAY_1, brendan: TRAINER_BRENDAN_1}
    battle_format: single
    optional: false
    location: hoenn-route-103
    hm_gates_open: []
    key_items: []
    areas_new: []
    notes: "Rival's Lv5 starter has the type advantage. No Poké Balls yet, so nothing is catchable before this fight. Birch's rescue battle on Route 101 is against a Lv2 Poochyena (Emerald: Zigzagoon) and can't be caught."
    source: "guide:Walkthrough:Pokemon_Ruby_and_Sapphire/Part_1#Rival_Battle_1"


# Encounters that can't be had before the Champion. Tools should say "postgame" or
# "event only" rather than "not in the data". This is about the encounter, not the
# place: an entry with `methods` blocks only those methods (Littleroot itself is where
# you start; only its gift is postgame).
never_reachable:
  - {area: littleroot-town, methods: [gift], reason: "the town is where you start; only Birch's Johto starter gift is postgame (after completing the Hoenn Pokédex)"}
  - {area: mossdeep-city/stevens-house, methods: [gift], reason: "you visit Steven's house for HM08 Dive before the Champion; only the Beldum gift comes after the Hall of Fame"}
  - {area: hoenn-safari-zone/expansion-north, reason: "Safari Zone expansion opens after the Hall of Fame"}
  - {area: hoenn-safari-zone/expansion-south, reason: "Safari Zone expansion opens after the Hall of Fame"}
  - {area: cave-of-origin/b2f, reason: "unused Ruby/Sapphire map in Emerald (PokeAPI still lists encounters)"}
  - {area: cave-of-origin/b3f, reason: "unused Ruby/Sapphire map in Emerald (PokeAPI still lists encounters)"}
  - {area: hoenn-altering-cave, reason: "opens after the Hall of Fame"}
  - {area: desert-underpass, reason: "opens after the Hall of Fame"}
  - {area: marine-cave, reason: "postgame (Kyogre)"}
  - {area: terra-cave, reason: "postgame (Groudon)"}
  - {area: roaming-hoenn, reason: "Latios/Latias start roaming after the Hall of Fame"}
  - {area: artisan-cave, reason: "Battle Frontier (postgame)"}
  - {area: hoenn-battle-frontier, reason: "Battle Frontier (postgame)"}

# Lockesmith progression file: DRAFT for review (PLAN.md section 4.4)
#
# The ordered list of story battles from the first rival fight to the Champion. The
# data doesn't say when each fight happens, so this file does. Agents and tools read
# it for "what's left", "what can I catch before X" and Nuzlocke level caps.
#
# How it was drafted
#   - Order and trainer constants: every {{Party}} block in the 21-part Bulbapedia Emerald
#     walkthrough (data/guide/) was matched to a pokeemerald party by exact species and
#     levels. All 32 battles below matched a decomp trainer (Space Center: per side).
#   - HM gates: an HM counts as open when you hold it AND have the badge that allows it
#     outside battle (Cut: Stone, Flash: Knuckle, Rock Smash: Dynamo, Strength: Heat,
#     Surf: Balance, Fly: Feather, Dive: Mind, Waterfall: Rain), at the point the
#     walkthrough hands it to you.
#   - Areas: each area is listed at the first battle it can be reached before, having
#     fought only the battles above it in this order. Detours that need no listed battle
#     count, so an area can open before the walkthrough visits it. The eight placements
#     first drafted as judgement calls were checked on 2026-11-01 against the decomp's
#     event scripts (data/maps/*/scripts.inc) and Bulbapedia; each battle's `notes` cites
#     the evidence.
#   - Badge order: the game only checks earlier badges at Norman's gym, which opens after
#     the first four in any order. Brawly can be deferred until Norman, and nothing from
#     Fortree to the Magma Hideout checks Winona's badge. This file follows the standard
#     order; a run that deviates is placed by the battles it has done, not its badge count.
#
# Fields (beyond PLAN.md's schema, see docs/decisions.md D5)
#   badges_before     badges held when the fight starts
#   trainer_consts    decomp TRAINER_* constants; null when starter_variants is used
#   starter_variants  rival fights only, keyed by the PLAYER's starter, then by rival.
#                     The rival is May if you play as Brendan and vice versa. Two fights
#                     differ by rival (Rustboro if you chose Torchic, Route 119 if you
#                     chose Mudkip), so RunState will need the player's gender or rival.
#   battle_format     single | double | multi. From this file, not the trainer struct:
#                     the Space Center multi battle is set up by a map script.
#   optional          true if the story doesn't force the fight
#   location          PokeAPI location slug of the battle
#   hm_gates_open     HMs usable in the field when the fight starts
#   key_items         encounter-gating items held: rods (fishing methods), devon-scope
#                     (Kecleon), go-goggles (Route 111 desert), pokeblock-case (Safari Zone)
#   areas_new         encounter areas that became reachable since the previous battle.
#                     `location` means every area of it; `location/area` one PokeAPI
#                     area; `location/main` the location's unnamed main area. A mapping
#                     `{area: <spec>, methods: [...]}` opens only those encounter
#                     methods, for places you can stand in before you can reach their
#                     grass (Route 115's beach). The loader (agent/progression.py)
#                     accumulates these into areas_reachable. An area counts only once
#                     you can stand in it: water-only routes wait for Surf, since the
#                     boat ride across them is a cutscene. Item and HM gates still apply
#                     on top: surf needs Surf, fishing a rod, rock-smash needs Rock
#                     Smash, seaweed (underwater) needs Dive.
#   source            guide chunk the fight is described in (data/guide/chunks.jsonl)
#   notes / review    context for the agent / open questions for the reviewer
#
# You can't catch anything before the first rival fight: Birch only hands out Poké
# Balls afterwards.


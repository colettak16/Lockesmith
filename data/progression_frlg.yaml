# LockeSmith progression file for Pokémon FireRed and LeafGreen (docs/decisions.md D16)
#
# The ordered story steps from the first rival fight to the Champion, shared by both versions
# (a value written as {firered: ..., leafgreen: ...} would be resolved per version; none is needed
# yet: the versions differ in wild tables, trades and prizes, which the databases hold).
#
# How it was drafted (DRAFT, before review rounds)
#   - Battles and trainer constants: every trainerbattle in pokefirered's map scripts that names a
#     leader, Elite Four member, champion, rival or Giovanni. Rival constants are named after the
#     RIVAL's starter (TRAINER_RIVAL_OAKS_LAB_BULBASAUR has a Bulbasaur), and the rival takes the
#     starter strong against the player's: Bulbasaur player -> *_CHARMANDER, Charmander -> *_SQUIRTLE,
#     Squirtle -> *_BULBASAUR (PalletTown_ProfessorOaksLab's RivalApproachForBattle branches).
#   - Order: Bulbapedia's walkthrough (data/guide_frlg), with the gates read from the decomp:
#       * HMs work outside battle with FLAG_BADGE01_GET + field move (party_menu.c): Flash Boulder,
#         Cut Cascade, Fly Thunder, Strength Rainbow, Surf Soul, Rock Smash Marsh, Waterfall Volcano.
#       * Viridian Gym opens with badges 2-7 (ViridianCity_EventScript_TryUnlockGym; Boulder isn't
#         checked); Route 23 has a guard per badge (Route23 coord events); Saffron's four gatehouses
#         want Tea (Celadon Condominiums 1F); a Rocket stands on the tile below Sabrina's door
#         (SaffronCity map.json (46,13), FLAG_HIDE_SAFFRON_ROCKETS) until Giovanni at Silph Co. 11F.
#       * The late Route 22 rival is armed by Viridian Gym (VAR_MAP_SCENE_ROUTE22 = 3) and its
#         trigger tiles span the path to Route 23; the early one is a detour (scene 1).
#       * The Sevii errand is optional: Bill's offer on Cinnabar can be declined
#         (CinnabarIsland_EventScript_DeclineSailToOneIsland). Once on One Island the ferry offers
#         Vermilion only after Bill brings you back (VAR_MAP_SCENE_CINNABAR_ISLAND = 4,
#         seagallop.inc EventScript_ChooseDestFromOneIsland), i.e. after Lostelle's rescue and the
#         Meteorite; PC storage is off on the islands until postgame (FLAG_SYS_PC_STORAGE_DISABLED).
#   - Same rules as Emerald's file: an area is listed at the first battle it can be reached before,
#     having fought only the battles above it; hm_gates_open and key_items are cumulative.
#   - `review:` marks what still needs checking against map connections or the review rounds.
#
# Before the National Dex (postgame), evolutions past #151 are cancelled: agent/games.py
# evolution_limit, not this file.


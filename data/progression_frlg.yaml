closes:
  - {area: ss-anne, after: rival4_ss_anne, reason: "the S.S. Anne leaves when you step off with HM01 (VAR_MAP_SCENE_VERMILION_CITY = 3); after that Vermilion's harbor sailor turns you away unless you have a Sevii pass, so the dock's fishing (SSAnne_Exterior) is only before the ship's rival"}

never_reachable:
  - {area: pallet-town, methods: [gift], reason: "the starter is your choice at Oak's Lab, not a catch"}
  - {area: kanto-route-3/pokemon-center, reason: "PokeAPI duplicate: the Magikarp salesman is in Route 4's Pokémon Center (Route4_PokemonCenter_1F); Route 3 has none"}
  - {area: kanto-pokecenter, reason: "the Japanese Colosseum bonus disc, not part of the game"}
  - {area: cerulean-cave, reason: "postgame: the guard steps aside once Celio's network machine works, after the Sevii Islands' Ruby and Sapphire quests (OneIsland_PokemonCenter_1F)"}
